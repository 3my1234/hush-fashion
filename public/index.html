<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hush | Fashion Store</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">HUSH</div>
      <span class="muted">Official Store</span>
    </div>
    <section class="hero">
      <h1>Modern Fashion For Him & Her</h1>
      <p>Browse premium Hush collections and place your order with delivery details.</p>
      <div class="filters">
        <button class="ghost" data-filter="all">All</button>
        <button class="ghost" data-filter="male">Male Wears</button>
        <button class="ghost" data-filter="female">Female Wears</button>
      </div>
    </section>

    <div class="layout">
      <section>
        <div id="products" class="grid"></div>
      </section>
      <section class="panel">
        <h3>Place Order</h3>
        <p class="muted">Select an outfit first, then fill your details.</p>
        <form id="orderForm">
          <label>Selected Outfit
            <input id="selectedProduct" placeholder="Click 'Order This' on a product" readonly required />
          </label>
          <label>Full Name <input id="clientName" required /></label>
          <label>Email <input id="email" type="email" required /></label>
          <label>Phone Number <input id="phone" required /></label>
          <label>House Address <textarea id="address" required></textarea></label>
          <div class="row">
            <label>Size <input id="size" placeholder="e.g. M" required /></label>
            <label>Color <input id="color" placeholder="e.g. Black" required /></label>
          </div>
          <div class="row">
            <label>Quantity <input id="quantity" type="number" value="1" min="1" /></label>
            <label>Note <input id="note" placeholder="Optional note" /></label>
          </div>
          <button type="submit">Submit Order</button>
        </form>
        <p id="formStatus" class="muted"></p>
      </section>
    </div>

    <section class="panel" style="margin-top:1rem;">
      <h3>Order Message Exchange</h3>
      <p class="muted">Client can send a follow-up message with optional image link after order placement.</p>
      <form id="messageForm">
        <div class="row">
          <label>Order ID <input id="msgOrderId" type="number" required /></label>
          <label>Your Name <input id="msgName" required /></label>
        </div>
        <label>Message <textarea id="msgBody" required></textarea></label>
        <label>Attachment URL (optional)
          <input id="msgAttachmentUrl" placeholder="https://... or s3://key" />
        </label>
        <label>Attachment Name (optional) <input id="msgAttachmentName" /></label>
        <button type="submit">Send Message</button>
      </form>
      <p id="msgStatus" class="muted"></p>
      <p id="liveClientNotice" class="muted"></p>
    </section>
  </div>
  <script src="/js/client.js"></script>
</body>
</html>
